<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITY MITRA - તમારા શહેરનો, તમારો મિત્ર</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Mukta for Gujarati & Inter for clean numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: #f3f4f6;
            color: #12304A;
        }
        .bg-navy { background-color: #12304A; }
        .text-navy { color: #12304A; }
        .bg-teal-brand { background-color: #00A88F; }
        .text-teal-brand { color: #00A88F; }
        .border-teal-brand { border-color: #00A88F; }
        .bg-yellow-brand { background-color: #FFC83D; }
        .text-yellow-brand { color: #FFC83D; }
        /* Hide scrollbars for clean mobile app look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-900 m-0 p-0">

    <!-- Mobile Device Container -->
    <div id="app-container" class="w-full max-w-md h-[100vh] sm:h-[844px] bg-white sm:rounded-[36px] sm:shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- TOP STATUS BAR -->
        <div class="bg-navy text-white px-6 py-2 text-xs flex justify-between items-center z-50">
            <span id="current-time">11:33</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-[10px]"></i>
            </div>
        </div>

        <!-- APP CONTENT AREA (Screens render here dynamically) -->
        <div id="screen-viewport" class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col bg-gray-50">
            <!-- Dynamic Screen Injected Here -->
        </div>

        <!-- GLOBAL BOTTOM NAVIGATION (Rendered on main app screens) -->
        <div id="bottom-nav" class="hidden bg-white border-t border-gray-200 py-2 px-4 justify-around items-center z-40 shadow-lg">
            <button onclick="switchScreen('home')" class="nav-btn flex flex-col items-center text-teal-brand" data-screen="home">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">હોમ</span>
            </button>
            <button onclick="switchScreen('orders')" class="nav-btn flex flex-col items-center text-gray-400" data-screen="orders">
                <i class="fa-solid fa-bag-shopping text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">ઓર્ડર</span>
            </button>
            <button onclick="switchScreen('rides')" class="nav-btn flex flex-col items-center text-gray-400" data-screen="rides">
                <i class="fa-solid fa-car text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">રાઇડ્સ</span>
            </button>
            <button onclick="switchScreen('offers')" class="nav-btn flex flex-col items-center text-gray-400" data-screen="offers">
                <i class="fa-solid fa-tags text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">ઓફર્સ</span>
            </button>
            <button onclick="switchScreen('profile')" class="nav-btn flex flex-col items-center text-gray-400" data-screen="profile">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">પ્રોફાઇલ</span>
            </button>
        </div>

    </div>

    <!-- JAVASCRIPT APP CONTROLLER & SCREENS -->
    <script>
        // Global App State
        const state = {
            currentScreen: 'splash',
            selectedCity: 'Talaja',
            mobileNumber: '',
            cart: [
                { id: 1, name: 'શુદ્ધ સીંગતેલ (1 Ltr)', price: 160, qty: 1, shop: 'પાટીદાર જનરલ સ્ટોર' },
                { id: 2, name: 'કાઠિયાવાડી ચા પત્તી (500g)', price: 210, qty: 1, shop: 'પાટીદાર જનરલ સ્ટોર' }
            ],
            orders: [
                { id: 'CM-8921', type: 'ગ્રોસરી', shop: 'પાટીદાર જનરલ સ્ટોર', amount: 370, status: 'Out for Delivery', date: 'આજે, 10:45 AM' },
                { id: 'CM-8845', type: 'ઓટો રાઇડ', shop: 'બસ સ્ટેન્ડ થી હોસ્પિટલ', amount: 50, status: 'Completed', date: 'ગઈકાલે' }
            ],
            activeRide: null
        };

        // Initialize App
        window.onload = () => {
            updateTime();
            setInterval(updateTime, 60000);
            switchScreen('splash');
        };

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }

        // Screen Router Controller
        function switchScreen(screenName) {
            state.currentScreen = screenName;
            const viewport = document.getElementById('screen-viewport');
            const bottomNav = document.getElementById('bottom-nav');

            // Show/Hide Bottom Navigation based on screen
            const hideNavScreens = ['splash', 'location', 'login', 'otp', 'checkout', 'payment', 'order-confirmation', 'live-tracking', 'driver-matching', 'live-ride', 'ride-completed'];
            if (hideNavScreens.includes(screenName)) {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
                updateBottomNavActive(screenName);
            }

            // Render Screen HTML
            viewport.innerHTML = getScreenHTML(screenName);
            viewport.scrollTop = 0;
        }

        function updateBottomNavActive(screen) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const s = btn.getAttribute('data-screen');
                if (s === screen) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-teal-brand');
                } else {
                    btn.classList.remove('text-teal-brand');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        // Screen Templates Generator
        function getScreenHTML(name) {
            switch(name) {
                case 'splash':
                    return `
                        <div class="flex-1 bg-navy flex flex-col justify-between items-center p-8 text-white text-center">
                            <div></div>
                            <div class="flex flex-col items-center">
                                <!-- Logo Icon -->
                                <div class="w-24 h-24 bg-teal-brand rounded-3xl flex items-center justify-center shadow-xl relative mb-6">
                                    <i class="fa-solid fa-location-dot text-white text-4xl"></i>
                                    <div class="absolute -top-2 -right-2 w-6 h-6 bg-yellow-brand rounded-full flex items-center justify-center text-navy font-bold text-xs shadow">
                                        <i class="fa-solid fa-smile"></i>
                                    </div>
                                </div>
                                <h1 class="text-3xl font-bold tracking-wider mb-2">CITY MITRA</h1>
                                <p class="text-yellow-brand text-lg font-medium">“તમારા શહેરનો, તમારો મિત્ર.”</p>
                            </div>
                            <button onclick="switchScreen('location')" class="w-full bg-teal-brand text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-teal-600 transition">
                                આગળ વધો <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    `;

                case 'location':
                    return `
                        <div class="flex-1 p-6 flex flex-col justify-between bg-white">
                            <div>
                                <div class="flex items-center justify-between mb-8">
                                    <button onclick="switchScreen('splash')" class="text-navy text-lg"><i class="fa-solid fa-arrow-left"></i></button>
                                    <span class="font-bold text-gray-500 text-sm">સ્ટેપ 1/2</span>
                                </div>
                                <h2 class="text-2xl font-bold text-navy mb-2">તમારું શહેર પસંદ કરો</h2>
                                <p class="text-gray-500 text-sm mb-6">તમારા સ્થાનિક વિસ્તારની શ્રેષ્ઠ સેવાઓ મેળવવા માટે.</p>
                                
                                <div class="space-y-3">
                                    <div onclick="state.selectedCity='Talaja'; switchScreen('login')" class="p-4 border-2 border-teal-brand bg-teal-50 rounded-2xl flex items-center justify-between cursor-pointer shadow-sm">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-teal-brand text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div>
                                            <div>
                                                <h4 class="font-bold text-navy">📍 તલાજા (Talaja)</h4>
                                                <p class="text-xs text-gray-500">પ્રાઇમરી લોકેશન - બધી સેવાઓ ઉપલબ્ધ</p>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-circle-check text-teal-brand text-xl"></i>
                                    </div>
                                    <div onclick="state.selectedCity='Bhavnagar'; switchScreen('login')" class="p-4 border border-gray-200 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-gray-50">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-gray-200 text-gray-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-city"></i></div>
                                            <div>
                                                <h4 class="font-bold text-navy">ભાવનગર (Bhavnagar)</h4>
                                                <p class="text-xs text-gray-500">ટૂંક સમયમાં શરૂ થઈ રહ્યું છે</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div onclick="state.selectedCity='Mahuva'; switchScreen('login')" class="p-4 border border-gray-200 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-gray-50">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-gray-200 text-gray-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-city"></i></div>
                                            <div>
                                                <h4 class="font-bold text-navy">મહુવા (Mahuva)</h4>
                                                <p class="text-xs text-gray-500">ટૂંક સમયમાં શરૂ થઈ રહ્યું છે</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button onclick="switchScreen('login')" class="w-full bg-navy text-white py-4 rounded-2xl font-bold text-lg shadow">
                                આગળ વધો
                            </button>
                        </div>
                    `;

                case 'login':
                    return `
                        <div class="flex-1 p-6 flex flex-col justify-between bg-white">
                            <div>
                                <button onclick="switchScreen('location')" class="text-navy text-lg mb-8"><i class="fa-solid fa-arrow-left"></i></button>
                                <h2 class="text-2xl font-bold text-navy mb-2">લોગિન અથવા સાઇન અપ</h2>
                                <p class="text-gray-500 text-sm mb-8">ઓર્ડર અને રાઇડ બુક કરવા માટે તમારો મોબાઈલ નંબર દાખલ કરો.</p>
                                
                                <label class="block text-xs font-bold text-gray-600 mb-2">મોબાઈલ નંબર</label>
                                <div class="flex items-center border border-gray-300 rounded-2xl px-4 py-3 bg-gray-50 focus-within:border-teal-brand">
                                    <span class="font-bold text-gray-700 mr-3">+91</span>
                                    <input type="tel5" id="phone-input" placeholder="98765 43210" maxlength="10" class="w-full bg-transparent outline-none font-medium text-navy text-lg" value="${state.mobileNumber}">
                                </div>
                            </div>
                            <button onclick="state.mobileNumber = document.getElementById('phone-input').value || '9876543210'; switchScreen('otp');" class="w-full bg-teal-brand text-white py-4 rounded-2xl font-bold text-lg shadow">
                                OTP મેળવો
                            </button>
                        </div>
                    `;

                case 'otp':
                    return `
                        <div class="flex-1 p-6 flex flex-col justify-between bg-white">
                            <div>
                                <button onclick="switchScreen('login')" class="text-navy text-lg mb-8"><i class="fa-solid fa-arrow-left"></i></button>
                                <h2 class="text-2xl font-bold text-navy mb-2">OTP વેરિફિકેશન</h2>
                                <p class="text-gray-500 text-sm mb-8">અમે +91 <span class="font-bold text-navy">${state.mobileNumber}</span> પર 4 અંકનો કોડ મોકલ્યો છે.</p>
                                
                                <div class="flex justify-between space-x-3 mb-6">
                                    <input type="text" maxlength="1" value="4" class="w-14 h-14 text-center text-xl font-bold border-2 border-teal-brand rounded-2xl bg-teal-50 outline-none">
                                    <input type="text" maxlength="1" value="8" class="w-14 h-14 text-center text-xl font-bold border-2 border-gray-200 rounded-2xl outline-none">
                                    <input type="text" maxlength="1" value="2" class="w-14 h-14 text-center text-xl font-bold border-2 border-gray-200 rounded-2xl outline-none">
                                    <input type="text" maxlength="1" value="9" class="w-14 h-14 text-center text-xl font-bold border-2 border-gray-200 rounded-2xl outline-none">
                                </div>
                                <p class="text-xs text-gray-400 text-center">કોડ નથી મળ્યો? <span class="text-teal-brand font-bold cursor-pointer">ફરી મોકલો</span></p>
                            </div>
                            <button onclick="switchScreen('home')" class="w-full bg-teal-brand text-white py-4 rounded-2xl font-bold text-lg shadow">
                                વેરિફાઈ અને લોગિન કરો
                            </button>
                        </div>
                    `;

                case 'home':
                    return `
                        <div class="flex-1 pb-24">
                            <!-- Top Header -->
                            <div class="bg-navy text-white px-6 pt-4 pb-6 rounded-b-[30px] shadow-md">
                                <div class="flex justify-between items-center mb-4">
                                    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchScreen('location')">
                                        <i class="fa-solid fa-location-dot text-teal-brand text-lg"></i>
                                        <div>
                                            <p class="text-[10px] text-gray-300">વર્તમાન લોકેશન</p>
                                            <h3 class="font-bold text-sm flex items-center">${state.selectedCity} <i class="fa-solid fa-angle-down ml-1 text-xs"></i></h3>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <div onclick="switchScreen('cart')" class="relative bg-white/10 p-2.5 rounded-full cursor-pointer">
                                            <i class="fa-solid fa-cart-shopping text-white text-sm"></i>
                                            <span class="absolute -top-1 -right-1 bg-yellow-brand text-navy text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">${state.cart.length}</span>
                                        </div>
                                        <div onclick="switchScreen('profile')" class="w-9 h-9 bg-teal-brand rounded-full flex items-center justify-center font-bold text-sm">ND</div>
                                    </div>
                                </div>
                                <!-- Search Bar -->
                                <div onclick="switchScreen('search')" class="bg-white text-gray-500 rounded-2xl px-4 py-3 flex items-center space-x-3 shadow cursor-pointer">
                                    <i class="fa-solid fa-magnifying-glass text-teal-brand"></i>
                                    <span class="text-sm font-medium">શું શોધવું છે? (કરિયાણું, ફૂડ, ઓટો...)</span>
                                </div>
                            </div>

                            <!-- Main Body Content -->
                            <div class="px-6 mt-6">
                                <!-- Banner Slider Card -->
                                <div class="bg-gradient-to-r from-teal-brand to-emerald-600 rounded-3xl p-5 text-white shadow-lg mb-6 relative overflow-hidden">
                                    <div class="absolute right-[-20px] bottom-[-20px] opacity-20 text-9xl"><i class="fa-solid fa-store"></i></div>
                                    <span class="bg-yellow-brand text-navy text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">ખાસ ઓફર</span>
                                    <h2 class="text-xl font-bold mt-2">તલાજાની તમામ દુકાનો હવે ઓનલાઈન!</h2>
                                    <p class="text-xs text-white/90 mt-1 mb-4">પહેલા ઓર્ડર પર મેળવો ફ્રી ડિલિવરી અને ₹૫૦ છૂટ.</p>
                                    <button onclick="switchScreen('shop-list')" class="bg-white text-teal-brand font-bold text-xs px-4 py-2 rounded-xl shadow">શોપ જુઓ</button>
                                </div>

                                <!-- Service Grid -->
                                <h3 class="font-bold text-navy text-base mb-4">અમારી સેવાઓ (Services)</h3>
                                <div class="grid grid-cols-4 gap-4 mb-6">
                                    <div onclick="switchScreen('category')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-teal-50 text-teal-brand rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-teal-100"><i class="fa-solid fa-basket-shopping"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">ગ્રોસરી</span>
                                    </div>
                                    <div onclick="switchScreen('food')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-orange-100"><i class="fa-solid fa-utensils"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">ફૂડ</span>
                                    </div>
                                    <div onclick="switchScreen('auto')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-yellow-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-yellow-100"><i class="fa-solid fa-taxi"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">ઓટો</span>
                                    </div>
                                    <div onclick="switchScreen('car')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-blue-100"><i class="fa-solid fa-car-side"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">કાર કેબ</span>
                                    </div>
                                    <div onclick="switchScreen('parcel')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-purple-100"><i class="fa-solid fa-box-archive"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">પાર્સલ</span>
                                    </div>
                                    <div onclick="switchScreen('shop-list')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-rose-100"><i class="fa-solid fa-shop"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">લોકલ શોપ</span>
                                    </div>
                                    <div onclick="switchScreen('category')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-emerald-100"><i class="fa-solid fa-pills"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">મેડિસિન</span>
                                    </div>
                                    <div onclick="switchScreen('offers')" class="flex flex-col items-center cursor-pointer">
                                        <div class="w-14 h-14 bg-pink-50 text-pink-600 rounded-2xl flex items-center justify-center text-xl shadow-sm mb-1.5 border border-pink-100"><i class="fa-solid fa-gift"></i></div>
                                        <span class="text-xs font-semibold text-gray-700">ઓફર્સ</span>
                                    </div>
                                </div>

                                <!-- Popular Near You -->
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="font-bold text-navy text-base">નજીકની લોકપ્રિય દુકાનો</h3>
                                    <span onclick="switchScreen('shop-list')" class="text-xs font-bold text-teal-brand cursor-pointer">બ બધું જુઓ</span>
                                </div>
                                <div class="space-y-3">
                                    <div onclick="switchScreen('shop-details')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4 cursor-pointer">
                                        <div class="w-16 h-16 bg-teal-100 text-teal-brand rounded-xl flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-store"></i></div>
                                        <div class="flex-1">
                                            <div class="flex justify-between items-start">
                                                <h4 class="font-bold text-navy text-sm">પાટીદાર જનરલ સ્ટોર</h4>
                                                <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full">૪.૮ ★</span>
                                            </div>
                                            <p class="text-xs text-gray-500 mt-0.5">કરિયાણું અને ડેઈલી નીડ્સ</p>
                                            <div class="flex items-center justify-between mt-2 text-[11px] text-gray-400">
                                                <span>📍 મેઈન બજાર, તલાજા</span>
                                                <span class="font-bold text-teal-brand">૧૦-૧૫ મિનિટ</span>
                                            </div>
                                        </div>
