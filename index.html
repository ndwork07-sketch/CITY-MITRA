<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CITY MITRA - તમારા શહેરનો, તમારો મિત્ર</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Mukta', sans-serif;
            background-color: #12304A;
            color: #12304A;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .bg-navy { background-color: #12304A; }
        .text-navy { color: #12304A; }
        .bg-teal-brand { background-color: #00A88F; }
        .text-teal-brand { color: #00A88F; }
        .border-teal-brand { border-color: #00A88F; }
        .bg-yellow-brand { background-color: #FFC83D; }
        .text-yellow-brand { color: #FFC83D; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-bg-pattern {
            background-image: radial-gradient(#00A88F 0.8px, transparent 0.8px), radial-gradient(#12304A 0.8px, #f8fafc 0.8px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: #12304A;
            color: #FFC83D;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            position: absolute;
            bottom: 60px;
            left: 0;
            z-index: 35;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        .ticker-move {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- TOP STATUS BAR -->
        <div class="bg-navy text-white px-4 py-2 text-xs flex justify-between items-center z-50 shrink-0">
            <span id="current-time">1:52</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-[10px]"></i>
            </div>
        </div>

        <!-- APP CONTENT AREA -->
        <div id="screen-viewport" class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col app-bg-pattern" style="padding-bottom: 95px;">
            <!-- Dynamic Screen Injected Here -->
        </div>

        <!-- RUNNING TICKER -->
        <div id="app-ticker" class="ticker-wrap">
            <div class="ticker-move">
                <span class="mx-4"><i class="fa-solid fa-bullhorn text-teal-brand mr-1"></i> તલાજામાં ગ્રોસરી અને ફૂડ ડિલિવરી લાઇવ છે!</span>
                <span class="mx-4"><i class="fa-solid fa-tag text-yellow-brand mr-1"></i> પહેલો ઓર્ડર કરો અને મેળવો WELCOME50 કૂપનથી ખાસ છૂટ.</span>
                <span class="mx-4"><i class="fa-solid fa-taxi text-teal-brand mr-1"></i> ઓટો-રિક્ષા અને કેબ બુકિંગ માત્ર એક ક્લિક પર!</span>
            </div>
        </div>

        <!-- FIXED BOTTOM NAVIGATION -->
        <div id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-1.5 px-2 flex justify-around items-center z-40 shadow-2xl" style="height: 60px;">
            <button onclick="switchScreen('home')" class="nav-btn flex flex-col items-center justify-center text-teal-brand flex-1 py-1" data-screen="home">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">હોમ</span>
            </button>
            <button onclick="switchScreen('orders')" class="nav-btn flex flex-col items-center justify-center text-gray-400 flex-1 py-1" data-screen="orders">
                <i class="fa-solid fa-bag-shopping text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">ઓર્ડર</span>
            </button>
            <button onclick="switchScreen('rides')" class="nav-btn flex flex-col items-center justify-center text-gray-400 flex-1 py-1" data-screen="rides">
                <i class="fa-solid fa-car text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">રાઇડ્સ</span>
            </button>
            <button onclick="switchScreen('offers')" class="nav-btn flex flex-col items-center justify-center text-gray-400 flex-1 py-1" data-screen="offers">
                <i class="fa-solid fa-tags text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">ઓફર્સ</span>
            </button>
            <button onclick="switchScreen('profile')" class="nav-btn flex flex-col items-center justify-center text-gray-400 flex-1 py-1" data-screen="profile">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">પ્રોફાઇલ</span>
            </button>
        </div>

    </div>

    <script>
        const state = {
            currentScreen: 'splash',
            selectedCity: 'Talaja',
            mobileNumber: '',
            cart: [
                { id: 1, name: 'શુદ્ધ સીંગતેલ (1 Ltr)', price: 160, qty: 1, shop: 'પાટીદાર જનરલ સ્ટોર' },
                { id: 2, name: 'કાઠિયાવાડી ચા પત્તી (500g)', price: 210, qty: 1, shop: 'પાટીદાર જનરલ સ્ટોર' }
            ],
            orders: [
                { id: 'CM-8921', type: 'ગ્રોસરી', shop: 'પાટીદાર જનરલ સ્ટોર', amount: 370, status: 'Out for Delivery', date: 'આજે, 10:45 AM' },
                { id: 'CM-8845', type: 'ઓટો રાઇડ', shop: 'બસ સ્ટેન્ડ થી હોસ્પિટલ', amount: 50, status: 'Completed', date: 'ગઈકાલે' }
            ]
        };

        window.onload = () => {
            updateTime();
            setInterval(updateTime, 60000);
            switchScreen('splash');
        };

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }

        function switchScreen(screenName) {
            state.currentScreen = screenName;
            const viewport = document.getElementById('screen-viewport');
            const bottomNav = document.getElementById('bottom-nav');
            const ticker = document.getElementById('app-ticker');

            const hideNavScreens = ['splash', 'location', 'login', 'otp', 'checkout', 'payment', 'order-confirmation', 'live-tracking', 'driver-matching', 'live-ride', 'ride-completed'];
            if (hideNavScreens.includes(screenName)) {
                bottomNav.style.display = 'none';
                if(ticker) ticker.style.display = 'none';
                viewport.style.paddingBottom = '0px';
            } else {
                bottomNav.style.display = 'flex';
                if(ticker) ticker.style.display = 'block';
                viewport.style.paddingBottom = '95px';
                updateBottomNavActive(screenName);
            }

            viewport.innerHTML = getScreenHTML(screenName);
            viewport.scrollTop = 0;
        }

        function updateBottomNavActive(screen) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const s = btn.getAttribute('data-screen');
                if (s === screen) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-teal-brand');
                } else {
                    btn.classList.remove('text-teal-brand');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        function getScreenHTML(name) {
            switch(name) {
                case 'splash':
                    return `
                        <div class="flex-1 bg-navy flex flex-col justify-between items-center p-8 text-white text-center h-full w-full absolute inset-0 z-50">
                            <div></div>
                            <div class="flex flex-col items-center">
                                <div class="w-24 h-24 bg-teal-brand rounded-3xl flex items-center justify-center shadow-xl relative mb-6">
                                    <i class="fa-solid fa-location-dot text-white text-4xl"></i>
                                    <div class="absolute -top-2 -right-2 w-6 h-6 bg-yellow-brand rounded-full flex items-center justify-center text-navy font-bold text-xs shadow">
                                        <i class="fa-solid fa-smile"></i>
                                    </div>
                                </div>
                                <h1 class="text-3xl font-bold tracking-wider mb-2">CITY MITRA</h1>
                                <p class="text-yellow-brand text-lg font-medium">“તમારા શહેરનો, તમારો મિત્ર.”</p>
                            </div>
                            <button onclick="switchScreen('location')" class="w-full bg-teal-brand text-white py-4 rounded-2xl font-bold text-lg shadow-lg">
                                આગળ વધો <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    `;
                case 'location':
                    return `
                        <div class="p-5 flex flex-col justify-between min-h-full">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <button onclick="switchScreen('splash')" class="text-navy text-lg"><i class="fa-solid fa-arrow-left"></i></button>
                                    <span class="font-bold text-gray-500 text-xs">સ્ટેપ 1/2</span>
                                </div>
                                <h2 class="text-xl font-bold text-navy mb-1">તમારું શહેર પસંદ કરો</h2>
                                <p class="text-gray-500 text-xs mb-5">તમારા સ્થાનિક વિસ્તારની શ્રેષ્ઠ સેવાઓ મેળવવા માટે.</p>
                                <div class="space-y-3">
                                    <div onclick="state.selectedCity='Talaja'; switchScreen('login')" class="p-4 border-2 border-teal-brand bg-teal-50/90 rounded-2xl flex items-center justify-between cursor-pointer shadow-sm">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-teal-brand text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div>
                                            <div>
                                                <h4 class="font-bold text-navy text-sm">📍 તલાજા (Talaja)</h4>
                                                <p class="text-[11px] text-gray-500">પ્રાઇમરી લોકેશન - બધી સેવાઓ ઉપલબ્ધ</p>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-circle-check text-teal-brand text-lg"></i>
                                    </div>
                                    <div onclick="state.selectedCity='Bhavnagar'; switchScreen('login')" class="p-4 border border-gray-200 bg-white/90 rounded-2xl flex items-center justify-between cursor-pointer">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-gray-200 text-gray-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-city"></i></div>
                                            <div>
                                                <h4 class="font-bold text-navy text-sm">ભાવનગર (Bhavnagar)</h4>
                                                <p class="text-[11px] text-gray-500">ટૂંક સમયમાં શરૂ થઈ રહ્યું છે</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button onclick="switchScreen('login')" class="w-full bg-navy text-white py-3.5 rounded-2xl font-bold text-sm mt-6 shadow">આગળ વધો</button>
                        </div>
                    `;
                case 'login':
                    return `
                        <div class="p-5 flex flex-col justify-between min-h-full">
                            <div>
                                <button onclick="switchScreen('location')" class="text-navy text-lg mb-4"><i class="fa-solid fa-arrow-left"></i></button>
                                <h2 class="text-xl font-bold text-navy mb-1">લોગિન અથવા સાઇન અપ</h2>
                                <p class="text-gray-500 text-xs mb-5">ઓર્ડર અને રાઇડ બુક કરવા માટે તમારો મોબાઈલ નંબર દાખલ કરો.</p>
                                <label class="block text-xs font-bold text-gray-600 mb-2">મોબાઈલ નંબર</label>
                                <div class="flex items-center border border-gray-300 rounded-2xl px-4 py-3 bg-white shadow-sm">
                                    <span class="font-bold text-gray-700 mr-3">+91</span>
                                    <input type="tel" id="phone-input" placeholder="98765 43210" maxlength="10" class="w-full bg-transparent outline-none font-medium text-navy text-base" value="${state.mobileNumber}">
                                </div>
                            </div>
                            <button onclick="state.mobileNumber = document.getElementById('phone-input').value || '9876543210'; switchScreen('otp');" class="w-full bg-teal-brand text-white py-3.5 rounded-2xl font-bold text-sm shadow mt-6">OTP મેળવો</button>
                        </div>
                    `;
                case 'otp':
                    return `
                        <div class="p-5 flex flex-col justify-between min-h-full">
                            <div>
                                <button onclick="switchScreen('login')" class="text-navy text-lg mb-4"><i class="fa-solid fa-arrow-left"></i></button>
                                <h2 class="text-xl font-bold text-navy mb-1">OTP વેરિફિકેશન</h2>
                                <p class="text-gray-500 text-xs mb-5">અમે +91 <span class="font-bold text-navy">${state.mobileNumber}</span> પર 4 અંકનો કોડ મોકલ્યો છે.</p>
                                <div class="flex justify-between space-x-2 mb-5">
                                    <input type="text" maxlength="1" value="4" class="w-12 h-12 text-center text-lg font-bold border-2 border-teal-brand rounded-xl bg-teal-50 outline-none">
                                    <input type="text" maxlength="1" value="8" class="w-12 h-12 text-center text-lg font-bold border-2 border-gray-200 bg-white rounded-xl outline-none">
                                    <input type="text" maxlength="1" value="2" class="w-12 h-12 text-center text-lg font-bold border-2 border-gray-200 bg-white rounded-xl outline-none">
                                    <input type="text" maxlength="1" value="9" class="w-12 h-12 text-center text-lg font-bold border-2 border-gray-200 bg-white rounded-xl outline-none">
                                </div>
                            </div>
                            <button onclick="switchScreen('home')" class="w-full bg-teal-brand text-white py-3.5 rounded-2xl font-bold text-sm shadow">વેરિફાઈ અને લોગિન કરો</button>
                        </div>
                    `;
                case 'home':
                    return `
                        <div class="pb-6">
                            <div class="bg-navy text-white px-5 pt-4 pb-6 rounded-b-[28px] shadow-md">
                                <div class="flex justify-between items-center mb-4">
                                    <div class="flex items-center space-x-2 cursor-pointer" onclick="switchScreen('location')">
                                        <i class="fa-solid fa-location-dot text-teal-brand text-base"></i>
                                        <div>
                                            <p class="text-[10px] text-gray-300">વર્તમાન લોકેશન</p>
                                            <h3 class="font-bold text-sm flex items-center">${state.selectedCity} <i class="fa-solid fa-angle-down ml-1 text-xs"></i></h3>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <div onclick="switchScreen('cart')" class="relative bg-white/10 p-2.5 rounded-full cursor-pointer">
                                            <i class="fa-solid fa-cart-shopping text-white text-sm"></i>
                                            <span class="absolute -top-1 -right-1 bg-yellow-brand text-navy text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">${state.cart.length}</span>
                                        </div>
                                        <div onclick="switchScreen('profile')" class="w-9 h-9 bg-teal-brand rounded-full flex items-center justify-center font-bold text-sm shadow">ND</div>
                                    </div>
                                </div>
                                <div onclick="switchScreen('search')" class="bg-white text-gray-500 rounded-2xl px-4 py-3 flex items-center space-x-3 shadow cursor-pointer">
                                    <i class="fa-solid fa-magnifying-glass text-teal-brand"></i>
                                    <span class="text-sm font-medium">શું શોધવું છે? (કરિયાણું, ફૂડ, ઓટો...)</span>
                                </div>
                            </div>
                            <div class="px-4 mt-4">
                                <div class="bg-gradient-to-r from-teal-brand to-emerald-600 rounded-3xl p-4 text-white shadow-lg mb-4 relative overflow-hidden">
                                    <span class="bg-yellow-brand text-navy text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">ખાસ ઓફર</span>
                                    <h2 class="text-base font-bold mt-1.5">તલાજાની તમામ દુકાનો હવે ઓનલાઈન!</h2>
                                    <p class="text-[11px] text-white/90 mt-0.5 mb-3">પહેલા ઓર્ડર પર મેળવો ફ્રી ડિલિવરી અને ₹૫૦ છૂટ.</p>
                                    <button onclick="switchScreen('shop-list')" class="bg-white text-teal-brand font-bold text-xs px-3.5 py-1.5 rounded-xl shadow">શોપ જુઓ</button>
                                </div>
                                <h3 class="font-bold text-navy text-sm mb-2.5">અમારી સેવાઓ (Services)</h3>
                                <div class="grid grid-cols-4 gap-2.5 mb-4">
                                    <div onclick="switchScreen('category')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-teal-50 text-teal-brand rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-basket-shopping"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">ગ્રોસરી</span>
                                    </div>
                                    <div onclick="switchScreen('food')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-utensils"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">ફૂડ</span>
                                    </div>
                                    <div onclick="switchScreen('auto')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-yellow-50 text-amber-600 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-taxi"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">ઓટો</span>
                                    </div>
                                    <div onclick="switchScreen('car')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-car-side"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">કાર કેબ</span>
                                    </div>
                                    <div onclick="switchScreen('parcel')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-box-archive"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">પાર્સલ</span>
                                    </div>
                                    <div onclick="switchScreen('shop-list')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-shop"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">લોકલ શોપ</span>
                                    </div>
                                    <div onclick="switchScreen('category')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-pills"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">મેડિસિન</span>
                                    </div>
                                    <div onclick="switchScreen('offers')" class="flex flex-col items-center cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-gray-100">
                                        <div class="bg-pink-50 text-pink-600 rounded-xl flex items-center justify-center text-lg mb-1" style="width:44px; height:44px;"><i class="fa-solid fa-gift"></i></div>
                                        <span class="text-[11px] font-semibold text-gray-700">ઓફર્સ</span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center mb-2.5">
                                    <h3 class="font-bold text-navy text-sm">નજીકની લોકપ્રિય દુકાનો</h3>
                                    <span onclick="switchScreen('shop-list')" class="text-xs font-bold text-teal-brand cursor-pointer">બ બધું જુઓ</span>
                                </div>
                                <div class="space-y-2.5">
